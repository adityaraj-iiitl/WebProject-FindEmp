spring.application.name=FindEmp
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:myappdb}?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQLUSER:myuser}
spring.datasource.password=${MYSQLPASSWORD:StrongPassword123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.referer=${OPENROUTER_REFERER:http://localhost:5173}
gemini.api.key=${GEMINI_API_KEY:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
